name: Profile cards

on:
  schedule:
    - cron: "23 0 * * *" # daily, 00:23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          # The built-in token sees public activity. To count private
          # contributions too, add a personal access token (read:user) as the
          # PROFILE_TOKEN secret.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          mkdir -p data
          gh api graphql -f login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount contributionLevel } }
                  }
                }
                repositories(first: 100, ownerAffiliations: OWNER, privacy: PUBLIC, orderBy: {field: PUSHED_AT, direction: DESC}) {
                  nodes { name description url stargazerCount forkCount primaryLanguage { name color } }
                }
              }
            }' > data/contributions.tmp
          mv data/contributions.tmp data/contributions.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install --quiet fonttools pillow
          python scripts/build_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          git diff --cached --quiet || { git commit -m "Refresh profile cards"; git push; }
